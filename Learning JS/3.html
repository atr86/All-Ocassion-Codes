<html> 
<head> 
<title>If statement</title> 
</head> 
<body bgcolor="pink"> 
<script type="text/javascript"> 
var age=parseInt(prompt("Enter age of the person","64")); 
if(age>60)
{
    document.write("<h1>Senior Citizen</h1>"); 
} 
else if( age<18)
{
    document.write("<h1>Non Working Citizen</h1>");
}
else if( age <30)
{
    document.write("<h1>Fresher</h1> <br> <h2>Experience pacchi</h2>");
}
else
{
    document.write("<h1>Working Citizen</h1>");
}
</script> 
</body> 
</html>
