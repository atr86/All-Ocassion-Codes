<!DOCTYPE html>
<html>
<head>
    <title>Browser Object (Navigator) Demo</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f4f4f9; }
        table { border-collapse: collapse; width: 100%; max-width: 800px; background: white; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #2c3e50; color: white; }
        tr:hover { background-color: #f1f1f1; }
        .highlight { color: #d35400; font-family: monospace; }
    </style>
</head>
<body>

    <h2>🕵️ Browser (Navigator) Object Inspector</h2>
    <p>Here is what your browser is telling websites about itself:</p>

    <table>
        <thead>
            <tr>
                <th>Property</th>
                <th>Current Value</th>
            </tr>
        </thead>
        <tbody id="infoTable">
            </tbody>
    </table>

    <script>
        // 1. We create an object to map the specific properties we want to display
        // Note: We use navigator.plugins.length because plugins is an array-like object
        var browserData = [
            { prop: "navigator.appCodeName", val: navigator.appCodeName },
            { prop: "navigator.appName", val: navigator.appName },
            { prop: "navigator.appVersion", val: navigator.appVersion },
            { prop: "navigator.userAgent", val: navigator.userAgent },
            { prop: "navigator.plugins", val: navigator.plugins.length + " plugin(s) installed" },
            { prop: "navigator.mimeTypes", val: navigator.mimeTypes.length + " MIME type(s) supported" }
        ];

        // 2. Loop through the data and build the table rows
        var tableBody = document.getElementById("infoTable");
        
        // We use a simple loop to generate the HTML
        for (var i = 0; i < browserData.length; i++) {
            var row = "<tr>" +
                      "<td class='highlight'>" + browserData[i].prop + "</td>" +
                      "<td>" + browserData[i].val + "</td>" +
                      "</tr>";
            
            // Append the new row to the table
            tableBody.innerHTML += row;
        }
    </script>

</body>
</html>
